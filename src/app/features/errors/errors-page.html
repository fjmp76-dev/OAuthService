<div class="errors-page">
  <div class="errors-page-header">
    <h1>Error Log</h1>
    <button mat-stroked-button (click)="clearLog()" [disabled]="entries().length === 0">
      <mat-icon>delete_sweep</mat-icon>
      Clear log
    </button>
  </div>

  @if (loading()) {
    <div class="loading"><mat-spinner diameter="32"></mat-spinner></div>
  } @else if (entries().length === 0) {
    <p class="empty-hint">No errors logged yet.</p>
  } @else {
    <table mat-table [dataSource]="entries()" class="errors-table">
      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef>Source</th>
        <td mat-cell *matCellDef="let entry" data-label="Source">
          <mat-chip [class]="'source-chip source-' + entry.source.toLowerCase()">{{ entry.source }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef>Message</th>
        <td mat-cell *matCellDef="let entry" data-label="Message">{{ entry.message }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let entry" data-label="Actions">
          <button mat-icon-button class="delete-icon" matTooltip="Delete entry" (click)="removeEntry(entry.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
